name: 🧪 Test

# Reusable workflow only — no push/pull_request trigger of its own.
# Called by deploy-prod.yml/deploy-next.yml (`jobs.test: uses:
# ./.github/workflows/test.yml`) so a publish can `needs: test` and never
# run against a build that doesn't typecheck or pass its suite.
on:
    workflow_call:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22.x"

            - name: Install Yarn 4.14.1
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate

            - run: yarn install --immutable
            - run: yarn typecheck
            - run: yarn test:ci
            - run: yarn lint
