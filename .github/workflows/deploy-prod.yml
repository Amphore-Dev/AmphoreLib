name: ☢︎ Publish Production Package

on:
    # Event for the workflow to run on new tag creation
    push:
        tags:
            - "v*.*.*" # Matches tags like v1.0.0, v2.1.3, etc.

permissions:
    contents: read
    # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
    # GitHub Actions exchanges this workflow's identity for a short-lived
    # publish credential, verified against the "Trusted Publisher" configured
    # on the npmjs.com package settings (repo + this exact workflow file).
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  registry-url: "https://registry.npmjs.org"

            - name: Install Yarn 4.14.1
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate

            - run: yarn install --immutable
            - run: yarn build

            # Node's bundled npm may predate OIDC Trusted Publishing support
            # (needs npm >=11.5.1) — bump it just for the publish step.
            - run: npm install -g npm@latest

            - run: npm publish
