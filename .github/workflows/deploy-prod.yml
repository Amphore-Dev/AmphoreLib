name: ☢︎ Publish Production Package

on:
    # Event for the workflow to run on new tag creation
    push:
        tags:
            - "v*.*.*" # Matches tags like v1.0.0, v2.1.3, etc.

permissions:
    contents: read
    # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
    # GitHub Actions exchanges this workflow's identity for a short-lived
    # publish credential, verified against the "Trusted Publisher" configured
    # on the npmjs.com package settings (repo + this exact workflow file).
    id-token: write

jobs:
    test:
        uses: ./.github/workflows/test.yml

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # registry-url IS required here — npm's own canonical Trusted
            # Publishing example keeps it (docs.npmjs.com/trusted-publishers)
            # despite it being blamed for a *different*, since-fixed
            # setup-node regression (actions/setup-node#1551) where a stray
            # NODE_AUTH_TOKEN alongside it broke OIDC. We don't set that
            # var, so this is the canonical, correct setup.
            - uses: actions/setup-node@v6
              with:
                  node-version: "22.x"
                  registry-url: "https://registry.npmjs.org"

            - name: Install Yarn 4.14.1
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate

            - run: yarn install --immutable
            - run: yarn build

            # setup-node@v6 negotiates the OIDC handshake, but npm itself
            # still needs to be >=11.5.1 to use the resulting credential —
            # Node's bundled npm may predate that. Bump it just for publish.
            - run: npm install -g npm@latest

            # This Trusted Publisher is configured stage-only ("Allow npm
            # publish" left unchecked, on purpose — direct publish gets a
            # 403 from OIDC itself, npm's registry, not this workflow).
            # `npm publish` puts a version live immediately; `npm stage
            # publish` queues it instead — a maintainer still has to review
            # and approve it (2FA, interactive — that step can't use OIDC,
            # so it can never happen from CI) before it's actually live.
            - run: npm stage publish
