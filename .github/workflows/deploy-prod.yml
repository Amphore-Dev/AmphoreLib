name: ☢︎ Publish Production Package

on:
    # Event for the workflow to run on new tag creation
    push:
        tags:
            - "v*.*.*" # Matches tags like v1.0.0, v2.1.3, etc.

permissions:
    contents: read
    # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
    # GitHub Actions exchanges this workflow's identity for a short-lived
    # publish credential, verified against the "Trusted Publisher" configured
    # on the npmjs.com package settings (repo + this exact workflow file).
    id-token: write

jobs:
    test:
        uses: ./.github/workflows/test.yml

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # No `registry-url` here on purpose: setting it makes setup-node
            # write a `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
            # line into .npmrc regardless of whether NODE_AUTH_TOKEN is set —
            # with no token secret (the whole point of OIDC), that line still
            # gets written with an empty/placeholder value, and npm sees *a*
            # classic auth line configured, so it never attempts the OIDC
            # exchange at all and publishes with a bad, empty credential
            # instead (a 404, not 401/403 — the registry won't even confirm
            # a scoped package exists to an unauthenticated request). npm's
            # own default registry is already npmjs.com; publishConfig in
            # package.json covers the "public access" part.
            - uses: actions/setup-node@v6
              with:
                  node-version: "22.x"

            - name: Install Yarn 4.14.1
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate

            - run: yarn install --immutable
            - run: yarn build

            # setup-node@v6 negotiates the OIDC handshake, but npm itself
            # still needs to be >=11.5.1 to use the resulting credential —
            # Node's bundled npm may predate that. Bump it just for publish.
            - run: npm install -g npm@latest

            - run: npm publish
