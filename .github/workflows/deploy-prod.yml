name: ☢︎ Publish Production Package

on:
    # Event for the workflow to run on new tag creation
    push:
        tags:
            - "v*.*.*" # Matches tags like v1.0.0, v2.1.3, etc.

permissions:
    contents: read
    # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
    # GitHub Actions exchanges this workflow's identity for a short-lived
    # publish credential, verified against the "Trusted Publisher" configured
    # on the npmjs.com package settings (repo + this exact workflow file).
    # actions/setup-node@v6 is what actually performs the handshake — v4
    # silently doesn't, and npm publish then falls back to no credential
    # at all (a 404, not a 401/403 — the registry won't even confirm a
    # scoped package exists to an unauthenticated request).
    id-token: write

jobs:
    test:
        uses: ./.github/workflows/test.yml

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: "22.x"
                  registry-url: "https://registry.npmjs.org"

            - name: Install Yarn 4.14.1
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate

            - run: yarn install --immutable
            - run: yarn build

            # setup-node@v6 negotiates the OIDC handshake, but npm itself
            # still needs to be >=11.5.1 to use the resulting credential —
            # Node's bundled npm may predate that. Bump it just for publish.
            - run: npm install -g npm@latest

            - run: npm publish
