name: ⚡︎ Publish Preprod Package 

on:
  # Event for the workflow to run on
  push:
    branches:
      - 'preprod' # Replace with the branch you want to deploy from

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm install
      - run: npm run build
      - run: npm ci
      - run: npm publish --registry=https://npm.pkg.github.com --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
