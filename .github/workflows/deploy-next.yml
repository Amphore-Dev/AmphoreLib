name: ⚡︎ Publish Preprod Package

on: [workflow_dispatch]

permissions:
    contents: read
    # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed,
    # see deploy-prod.yml's own comment for the full explanation.
    id-token: write

jobs:
    test:
        uses: ./.github/workflows/test.yml

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # registry-url required — see deploy-prod.yml's comment.
            - uses: actions/setup-node@v6
              with:
                  node-version: "22.x"
                  registry-url: "https://registry.npmjs.org"

            - name: Install Yarn 4.14.1
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate

            - run: yarn install --immutable
            - run: yarn build

            # setup-node@v6 negotiates the OIDC handshake, but npm itself
            # still needs to be >=11.5.1 to use the resulting credential —
            # Node's bundled npm may predate that. Bump it just for publish.
            - run: npm install -g npm@latest

            # Same stage-only Trusted Publisher as deploy-prod.yml — see
            # its comment. Untested whether `npm stage publish` accepts
            # `--tag` the same way `npm publish` does; if not, this errors
            # clearly rather than silently publishing to the wrong tag.
            - run: npm stage publish --tag next
