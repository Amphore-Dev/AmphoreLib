name: ⚡︎ Publish Preprod Package

on: [workflow_dispatch]

permissions:
    contents: read
    # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed,
    # see deploy-prod.yml's own comment for the full explanation.
    id-token: write

jobs:
    test:
        uses: ./.github/workflows/test.yml

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # No `registry-url` — see deploy-prod.yml's comment: it makes
            # setup-node write a broken .npmrc auth line that silently
            # skips the OIDC exchange entirely.
            - uses: actions/setup-node@v6
              with:
                  node-version: "22.x"

            - name: Install Yarn 4.14.1
              run: |
                  corepack enable
                  corepack prepare yarn@4.14.1 --activate

            - run: yarn install --immutable
            - run: yarn build

            # setup-node@v6 negotiates the OIDC handshake, but npm itself
            # still needs to be >=11.5.1 to use the resulting credential —
            # Node's bundled npm may predate that. Bump it just for publish.
            - run: npm install -g npm@latest

            - run: npm publish --tag next
